[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graviq"
version = "0.1.0"
description = "Simulating Subsurface Mapping with a Qubit-Based Gravimeter"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.13.0",
    "tqdm>=4.65.0",
    "flask>=2.3.0",
    "qiskit>=0.45.0",
    "qiskit-aer>=0.13.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graviq = ["templates/*"]
