<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraviQ Tunnel Detection</title>
</head>
<body>
    <h1>GraviQ: Tunnel Detection Demo</h1>
    <p>Generate a random density grid or upload a .npy file to run tunnel detection.</p>
    <button id="generate">Generate random grid</button>
    <form id="upload-form">
        <input type="file" name="file" accept=".npy">
        <button type="submit">Upload .npy</button>
    </form>
    <div id="result"></div>
    <script>
        document.getElementById('generate').onclick = async () => {
            const res = await fetch('/generate', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                document.getElementById('result').innerHTML = '<img src="data:image/png;base64,' + data.image + '" alt="Result">';
            }
        };
        document.getElementById('upload-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                document.getElementById('result').innerHTML = '<img src="data:image/png;base64,' + data.image + '" alt="Result">';
            }
        };
    </script>
</body>
</html>
